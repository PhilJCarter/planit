[project]
name = "planit"
version = "1.0.3"
authors = [
    {name = "Philip Carter", email = "p.carter@bristol.ac.uk"},
]
description = "The PLANetary Impact Toolkit provides tools for accessing, manipulating, and analysing smoothed particle hydrodynamcis (SPH) impact simulation data, and creating planets for SPH impact simulations."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.10"
dependencies = ["numpy","scipy","matplotlib","numba","h5py","seagen","cmasher","IPython","matplotlib.animation"]
[project.urls]
Homepage = "https://github.com/PhilJCarter/planit"

[tool.coverage.report]
exclude_also = [
    'if debug:',
    'def EOScurve',
    'def EOSpoint',
    'def querypt',
    'def writestdsesame',
    'def writeextsesame',
    'def writegadgetinitsesame',
    'def writemdqsesame',
    'def writestdgadget',
    'def writeextgadget',
    'class TillotsonClass',
    'def Till_P_co',
    'def Till_P_ex',
    'def Till_P_Hosono',
    'def Till_dPdrho',
    'def Till_dPdu',
    'def Till_SoundSpeed',
    'def Till_P',
    'def tilleos_ea',
]